<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fbf9ff">
    <meta name="description" content="Цветочная полянка — игра на счёт и цвета. Собери букет и подари его маме!">
    <title>Цветочная полянка</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./styles.css?v=5">
    <script type="module" src="./game.js?v=7"></script>
  </head>
  <body>
    <header class="page-header">
      <div class="page-width header-inner">
        <div class="brand">
          <span class="brand-mark"><img id="brand-flower" alt="" width="33" height="33"></span>
          <span>Цветочная полянка</span>
        </div>
        <button type="button" class="sound-button" id="sound" aria-haspopup="dialog" aria-controls="sound-settings" aria-label="Настройки звука">
          <span class="icon icon-speaker" aria-hidden="true"></span>
          <span id="sound-label">Звук</span>
        </button>
      </div>
    </header>

    <main class="page-width game">
      <div class="game-heading">
        <h1>Сбор цветов</h1>
        <div class="progress">
          <span id="round-label">Раунд 1 из 7</span>
          <ol class="round-steps" id="round-steps" aria-label="Раунды"></ol>
        </div>
      </div>

      <section class="mission" aria-labelledby="task">
        <button type="button" class="listen" id="listen" aria-label="Послушать задание" title="Послушать задание">
          <span class="icon icon-speaker" aria-hidden="true"></span>
        </button>
        <div class="mission-text">
          <h2 id="task">Собери 5 синих цветов</h2>
          <p id="mission-hint">Потом подари букет маме.</p>
        </div>
        <ul class="target-list" id="targets" aria-label="Цветы для букета"></ul>
      </section>

      <section class="meadow" id="meadow" tabindex="0" aria-label="Цветочная лужайка" aria-describedby="how-to-play" aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight Space">
        <div class="meadow-scenery" aria-hidden="true">
          <img class="meadow-art" src="./assets/meadow.webp?v=2" alt="" fetchpriority="high" width="1921" height="819">
          <div class="meadow-clouds">
            <div class="cloud-lane cloud-one"><img src="./assets/scenery/cloud-one.webp" alt=""></div>
            <div class="cloud-lane cloud-two"><img src="./assets/scenery/cloud-two.webp" alt=""></div>
            <div class="cloud-lane cloud-three"><img src="./assets/scenery/cloud-three.webp" alt=""></div>
          </div>
          <img class="tree-leaves leaves-left" src="./assets/scenery/leaves-left.webp" alt="">
          <img class="tree-leaves leaves-right" src="./assets/scenery/leaves-right.webp" alt="">
        </div>
        <div class="butterfly" aria-hidden="true"><i></i><i></i></div>
        <div id="mushrooms" class="mushrooms" aria-hidden="true"></div>
        <div id="flowers" class="flowers"></div>
        <div id="hedgehog" class="hedgehog" role="img" aria-label="Ёжик собирает грибы" hidden>
          <span class="ground-shadow"></span>
          <div class="hedgehog-rig" aria-hidden="true">
            <img class="hedgehog-paw paw-back-far paw-opposite" src="./assets/characters/hedgehog-paw.webp" alt="">
            <img class="hedgehog-paw paw-front-far" src="./assets/characters/hedgehog-paw.webp" alt="">
            <img class="hedgehog-paw paw-back-near" src="./assets/characters/hedgehog-paw.webp" alt="">
            <img class="hedgehog-paw paw-front-near paw-opposite" src="./assets/characters/hedgehog-paw.webp" alt="">
            <img class="hedgehog-body" src="./assets/characters/hedgehog-body.webp" alt="">
          </div>
        </div>
        <div class="girl" id="girl" data-pose="stand" aria-hidden="true">
          <span class="ground-shadow"></span>
          <div class="girl-poses">
            <img src="./assets/characters/girl.webp" alt="" class="girl-stand" draggable="false">
            <img src="./assets/characters/run-1.webp" alt="" class="girl-run-one" draggable="false">
            <img src="./assets/characters/run-2.webp" alt="" class="girl-run-two" draggable="false">
            <span class="carried-flowers" id="carried-flowers"></span>
          </div>
          <span class="girl-exclamation">Ой-й-й!</span>
        </div>
        <div id="dropped-flowers" class="dropped-flowers" aria-hidden="true"></div>
        <button type="button" id="mom" class="mom" aria-label="Подарить цветы маме">
          <span class="mom-name" aria-hidden="true">Мама</span>
          <span class="ground-shadow" aria-hidden="true"></span>
          <img src="./assets/characters/mom.webp" alt="" draggable="false">
        </button>
        <div class="game-hud">
          <div class="timer" id="timer" role="timer" aria-label="Осталось 2:00">
            <span class="icon icon-clock" aria-hidden="true"></span>
            <span id="time" aria-hidden="true">2:00</span>
            <span class="timer-track" aria-hidden="true"></span>
          </div>
          <button class="pause-button" id="pause-game" type="button" aria-keyshortcuts="P" disabled>
            <span class="pause-symbol" aria-hidden="true"></span>
            <span id="pause-label">Пауза</span>
          </button>
        </div>
        <div class="pause-shade" aria-hidden="true"><span>Пауза</span></div>
        <div class="feedback" id="feedback" role="status" aria-atomic="true"></div>
      </section>

      <div class="controls">
        <div class="basket">
          <span class="basket-icon" aria-hidden="true"><span class="icon icon-basket"></span></span>
          <div class="basket-label">
            <span>В корзинке</span>
            <strong id="basket-total" role="status">0 цветов</strong>
          </div>
        </div>
        <ul class="basket-flowers" id="basket-flowers" aria-label="Собранные цветы"></ul>
        <p id="how-to-play" class="tip">
          <span class="icon icon-tap" aria-hidden="true"></span>
          <span id="movement-hint">Нажимай на цветы, чтобы собрать их.</span>
        </p>
        <button type="button" class="primary-button" id="main-action">
          <span class="icon icon-play" aria-hidden="true"></span>
          <span>Начать игру</span>
        </button>
      </div>
      <noscript><p>Для игры нужно включить JavaScript в браузере.</p></noscript>
    </main>

    <dialog id="celebration" class="celebration" aria-labelledby="celebration-title" aria-describedby="celebration-message">
      <div class="celebration-card">
        <div class="celebration-art" aria-hidden="true">
          <span class="party-heart heart-left icon icon-heart"></span>
          <span class="party-heart heart-right icon icon-heart"></span>
          <span class="party-sparkle sparkle-left"></span>
          <span class="party-sparkle sparkle-right"></span>
          <div class="celebration-mom" id="celebration-mom">
            <img class="smell-pose" src="./assets/characters/smell.webp" alt="">
            <img class="hug-pose" src="./assets/characters/hug.webp" alt="">
            <div class="bouquet" id="bouquet"></div>
          </div>
        </div>
        <h2 id="celebration-title">Спасибо, доченька!</h2>
        <p id="celebration-message">Ты собрала нужный букет.</p>
        <button type="button" class="primary-button" id="next-round">
          <span>Следующий раунд</span>
          <span class="icon icon-arrow" aria-hidden="true"></span>
        </button>
      </div>
    </dialog>

    <dialog id="sound-settings" class="sound-settings" aria-labelledby="sound-heading">
      <h2 id="sound-heading">Звук</h2>
      <label class="sound-switch">
        <input type="checkbox" id="sound-enabled" checked>
        <span>Озвучка в игре</span>
      </label>
      <form method="dialog"><button class="primary-button">Готово</button></form>
    </dialog>

    <audio id="voice" preload="auto"></audio>
  </body>
</html>
